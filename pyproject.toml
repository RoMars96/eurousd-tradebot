[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "EUR/USD liquidity-sweep trading bot for MT5"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
